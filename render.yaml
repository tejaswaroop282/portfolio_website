services:
  - type: web
    name: kingdom-of-code
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
